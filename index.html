<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoVail - แพลตฟอร์มส่งข้อความนิรนามสุดล้ำ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fdf4ff',
                            500: '#d946ef',
                            600: '#c026d3',
                            700: '#a21caf',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .blur-reveal { filter: blur(12px); transition: filter 0.3s ease; cursor: pointer; }
        .blur-reveal:active, .blur-reveal:hover { filter: blur(0); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-brand-500 selection:text-white">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 backdrop-blur-md bg-slate-950/80 border-b border-slate-800 px-4 py-3">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="#" onclick="router('home')" class="flex items-center gap-2 font-bold text-xl text-transparent bg-clip-text bg-gradient-to-r from-brand-500 to-indigo-500">
                <svg class="w-8 h-8 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round-width" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                EchoVail
            </a>
            <div id="nav-auth-container" class="flex items-center gap-3">
                <!-- Dynamically populated based on Auth State -->
            </div>
        </div>
    </nav>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

    <!-- Main App Container -->
    <main id="app-container" class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6">
        <!-- Render views dynamically here -->
    </main>

    <!-- Modal Container -->
    <div id="global-modal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div id="modal-content" class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl p-6 shadow-2xl relative">
            <!-- Modal Content -->
        </div>
    </div>

    <!-- Firebase SDKs (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addQueryConstraint, query, where, getDocs, orderBy, limit, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAuafJFSxf5MH2wG8UO5er14peRwT1jl8g",
            authDomain: "anonmsg-7fc77.firebaseapp.com",
            projectId: "anonmsg-7fc77",
            storageBucket: "anonmsg-7fc77.firebasestorage.app",
            messagingSenderId: "619051284089",
            appId: "1:619051284089:web:599084ffeeedf557de46a8",
            measurementId: "G-367T0PCVBJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const IMGBB_API_KEY = "2ee007fe6916aba0796a39684e15efe7";

        // Global State
        let currentUser = null;
        let currentView = 'home';
        let viewParams = {};

        // Helper: Show Toast
        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-xl text-sm font-medium shadow-lg border backdrop-blur-md transition-all duration-300 flex items-center gap-2 ${
                type === 'success' ? 'bg-emerald-900/80 border-emerald-700 text-emerald-200' : 'bg-rose-900/80 border-rose-700 text-rose-200'
            }`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Router Controller
        window.router = function(view, params = {}) {
            currentView = view;
            viewParams = params;
            const container = document.getElementById('app-container');
            container.innerHTML = '';

            const urlParams = new URLSearchParams(window.location.search);
            const targetUser = urlParams.get('u');

            if (targetUser && view === 'home') {
                renderPublicProfile(targetUser, container);
                return;
            }

            switch(view) {
                case 'home':
                    renderHome(container);
                    break;
                case 'auth':
                    renderAuth(container, params.mode || 'login');
                    break;
                case 'dashboard':
                    if (!currentUser) { router('auth'); return; }
                    renderDashboard(container);
                    break;
                case 'inbox':
                    if (!currentUser) { router('auth'); return; }
                    renderInbox(container);
                    break;
                case 'analytics':
                    if (!currentUser) { router('auth'); return; }
                    renderAnalytics(container);
                    break;
                case 'wall':
                    renderPublicWall(container, params.uid);
                    break;
                default:
                    renderHome(container);
            }
        }

        // Auth Observer
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            updateNavbar();
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('u')) {
                router('home');
            } else if (currentView === 'home' && !user) {
                renderHome(document.getElementById('app-container'));
            } else if (currentView === 'home' && user) {
                router('dashboard');
            }
        });

        function updateNavbar() {
            const navAuth = document.getElementById('nav-auth-container');
            if (currentUser) {
                navAuth.innerHTML = `
                    <button onclick="router('dashboard')" class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-700 rounded-lg text-sm font-medium transition">Dashboard</button>
                    <button onclick="router('inbox')" class="px-3 py-1.5 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium transition">Inbox</button>
                    <button onclick="handleLogout()" class="px-3 py-1.5 bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 border border-rose-800/50 rounded-lg text-sm font-medium transition">ออกจากระบบ</button>
                `;
            } else {
                navAuth.innerHTML = `
                    <button onclick="router('auth', {mode: 'login'})" class="px-4 py-2 text-slate-300 hover:text-white text-sm font-medium">เข้าสู่ระบบ</button>
                    <button onclick="router('auth', {mode: 'register'})" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-sm font-medium shadow-lg shadow-brand-600/30 transition">สมัครสมาชิก</button>
                `;
            }
        }

        window.handleLogout = async function() {
            await signOut(auth);
            showToast("ออกจากระบบเรียบร้อยแล้ว", "success");
            router('home');
        }

        // 1. Home View / Landing
        function renderHome(container) {
            container.innerHTML = `
                <div class="py-12 md:py-20 flex flex-col items-center text-center">
                    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-brand-500/10 border border-brand-500/20 text-brand-400 text-xs font-semibold mb-6">
                        <span class="w-2 h-2 rounded-full bg-brand-500 animate-pulse"></span> แพลตฟอร์มรับข้อความนิรนามสุดปลอดภัย
                    </div>
                    <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight max-w-2xl mb-6 leading-tight">
                        รับข้อความนิรนามจากเพื่อน ๆ <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-500 to-indigo-500">ได้อย่างไร้ตัวตน</span>
                    </h1>
                    <p class="text-slate-400 text-base md:text-lg max-w-xl mb-8">
                        สร้างลิงก์ส่วนตัว แชร์ให้เพื่อน ส่งข้อความ แนบรูปภาพ บันทึกเสียงพร้อมเอฟเฟกต์ และแชร์ลง Instagram Story ได้ทันที!
                    </p>
                    <div class="flex flex-wrap gap-4 justify-center">
                        <button onclick="router('auth', {mode: 'register'})" class="px-6 py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-2xl shadow-xl shadow-brand-600/30 transition">
                            เริ่มต้นใช้งานฟรี
                        </button>
                        <button onclick="router('auth', {mode: 'login'})" class="px-6 py-3.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 font-semibold rounded-2xl transition">
                            เข้าสู่ระบบ
                        </button>
                    </div>
                </div>
            `;
        }

        // 2. Auth View (Login / Register)
        function renderAuth(container, mode) {
            const isLogin = mode === 'login';
            container.innerHTML = `
                <div class="max-w-md mx-auto mt-10 bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 shadow-2xl">
                    <h2 class="text-2xl font-bold mb-2">${isLogin ? 'ยินดีต้อนรับกลับมา' : 'สร้างบัญชีผู้ใช้ใหม่'}</h2>
                    <p class="text-slate-400 text-sm mb-6">${isLogin ? 'กรอกข้อมูลเพื่อเข้าสู่ระบบกล่องข้อความของคุณ' : 'สมัครสมาชิกเพื่อรับลิงก์ข้อความนิรนามส่วนตัว'}</p>
                    
                    <form id="auth-form" class="space-y-4">
                        ${!isLogin ? `
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1">USERNAME (สำหรับลิงก์รับข้อความ)</label>
                                <input type="text" id="auth-username" required placeholder="เช่น myname" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1">ชื่อที่แสดง (Display Name)</label>
                                <input type="text" id="auth-displayname" required placeholder="เช่น พี่เอ" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-500">
                            </div>
                        ` : ''}
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">อีเมล</label>
                            <input type="email" id="auth-email" required placeholder="name@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">รหัสผ่าน</label>
                            <input type="password" id="auth-password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-500">
                        </div>
                        <button type="submit" class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-lg shadow-brand-600/30 transition">
                            ${isLogin ? 'เข้าสู่ระบบ' : 'สมัครสมาชิก'}
                        </button>
                    </form>
                    
                    <div class="mt-6 text-center text-sm text-slate-400">
                        ${isLogin ? 'ยังไม่มีบัญชีใช่ไหม?' : 'มีบัญชีอยู่แล้ว?'} 
                        <button onclick="router('auth', {mode: '${isLogin ? 'register' : 'login}'})" class="text-brand-400 font-semibold hover:underline ml-1">
                            ${isLogin ? 'สมัครสมาชิก' : 'เข้าสู่ระบบ'}
                        </button>
                    </div>
                </div>
            `;

            document.getElementById('auth-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('auth-email').value;
                const password = document.getElementById('auth-password').value;

                try {
                    if (isLogin) {
                        await signInWithEmailAndPassword(auth, email, password);
                        showToast("เข้าสู่ระบบสำเร็จ!", "success");
                        router('dashboard');
                    } else {
                        const username = document.getElementById('auth-username').value.toLowerCase().trim();
                        const displayName = document.getElementById('auth-displayname').value.trim();

                        // Check username uniqueness
                        const userRef = doc(db, "usernames", username);
                        const userSnap = await getDoc(userRef);
                        if (userSnap.exists()) {
                            showToast("Username นี้ถูกใช้งานแล้ว กรุณาเลือกชื่ออื่น", "error");
                            return;
                        }

                        const cred = await createUserWithEmailAndPassword(auth, email, password);
                        const uid = cred.user.uid;

                        await setDoc(doc(db, "users", uid), {
                            uid,
                            username,
                            usernameLower: username,
                            displayName,
                            bio: "ส่งข้อความนิรนามถึงฉันได้ที่นี่!",
                            photoURL: "",
                            acceptsMessages: true,
                            createdAt: serverTimestamp()
                        });

                        await setDoc(userRef, { uid });
                        showToast("สมัครสมาชิกสำเร็จ!", "success");
                        router('dashboard');
                    }
                } catch (err) {
                    showToast(err.message, "error");
                }
            });
        }

        // 3. Public Profile / Send Anonymous Message View
        async function renderPublicProfile(username, container) {
            container.innerHTML = `<div class="text-center py-20 text-slate-500">กำลังโหลดโปรไฟล์...</div>`;

            try {
                const usernameRef = doc(db, "usernames", username.toLowerCase());
                const usernameSnap = await getDoc(usernameRef);
                if (!usernameSnap.exists()) {
                    container.innerHTML = `<div class="text-center py-20 text-rose-500 font-semibold">ไม่พบผู้ใช้งานนี้</div>`;
                    return;
                }

                const ownerUid = usernameSnap.data().uid;
                const userSnap = await getDoc(doc(db, "users", ownerUid));
                if (!userSnap.exists()) {
                    container.innerHTML = `<div class="text-center py-20 text-rose-500 font-semibold">ไม่พบข้อมูลผู้ใช้</div>`;
                    return;
                }

                const userData = userSnap.data();

                container.innerHTML = `
                    <div class="max-w-lg mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl mt-6">
                        <div class="flex flex-col items-center text-center mb-6">
                            <div class="w-24 h-24 rounded-full bg-slate-800 border-2 border-brand-500 overflow-hidden mb-4 shadow-lg">
                                <img src="${userData.photoURL || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + userData.username}" class="w-full h-full object-cover">
                            </div>
                            <h1 class="text-xl font-bold">${userData.displayName}</h1>
                            <p class="text-slate-400 text-sm">@${userData.username}</p>
                            <p class="text-slate-300 text-sm mt-2 max-w-sm">${userData.bio || ''}</p>
                        </div>

                        ${!userData.acceptsMessages ? `
                            <div class="bg-rose-950/50 border border-rose-800/50 text-rose-300 p-4 rounded-2xl text-center text-sm font-medium">
                                ผู้ใช้นี้ปิดรับข้อความชั่วคราวในขณะนี้
                            </div>
                        ` : `
                            <form id="send-message-form" class="space-y-4">
                                <div class="relative">
                                    <textarea id="msg-content" rows="4" required placeholder="ส่งข้อความนิรนามถึง ${userData.displayName}..." class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-sm focus:outline-none focus:border-brand-500 resize-none"></textarea>
                                    <div class="absolute bottom-3 right-3 flex items-center gap-2">
                                        <button type="button" id="btn-random-q" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-slate-300 text-xs font-medium transition flex items-center gap-1" title="สุ่มคำถาม">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                                        </button>
                                    </div>
                                </div>

                                <!-- Attachment & Voice Recording Section -->
                                <div class="flex items-center justify-between bg-slate-950 border border-slate-800 rounded-2xl p-3">
                                    <div class="flex items-center gap-2">
                                        <label class="cursor-pointer p-2 bg-slate-900 hover:bg-slate-800 rounded-xl text-slate-300 text-xs font-medium transition flex items-center gap-1.5">
                                            <svg class="w-4 h-4 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                            แนบรูป
                                            <input type="file" id="msg-image" accept="image/*" class="hidden">
                                        </label>
                                        <button type="button" id="btn-record-audio" class="p-2 bg-slate-900 hover:bg-slate-800 rounded-xl text-slate-300 text-xs font-medium transition flex items-center gap-1.5">
                                            <svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"></path></svg>
                                            อัดเสียง
                                        </button>
                                    </div>
                                    <div id="attachment-preview" class="text-xs text-slate-400 truncate max-w-[150px]"></div>
                                </div>

                                <button type="submit" id="btn-submit-msg" class="w-full py-4 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-2xl shadow-lg shadow-brand-600/30 transition">
                                    ส่งข้อความนิรนาม 🚀
                                </button>
                            </form>
                        `}

                        <div class="mt-8 pt-6 border-t border-slate-800 flex justify-center">
                            <button onclick="router('wall', {uid: '${ownerUid}'})" class="text-sm text-brand-400 font-semibold hover:underline">
                                ดู Public Wall ของ ${userData.displayName} ✨
                            </button>
                        </div>
                    </div>
                `;

                // Setup Random Questions
                const questions = [
                    "ช่วงนี้มีอะไรที่ทำให้ยิ้มได้บ้าง?",
                    "ถ้าเลือกไปเที่ยวได้หนึ่งที่ อยากไปที่ไหน?",
                    "เพลงที่ฟังบ่อยที่สุดช่วงนี้คือเพลงอะไร?",
                    "สิ่งอยากลองทำสักครั้งในชีวิตคืออะไร?",
                    "เรื่องเล็ก ๆ ที่ทำให้มีความสุขวันนี้คืออะไร?"
                ];
                document.getElementById('btn-random-q')?.addEventListener('click', () => {
                    const randomQ = questions[Math.floor(Math.random() * questions.length)];
                    document.getElementById('msg-content').value = randomQ;
                });

                // Image Upload preview & Imgbb integration
                let uploadedImageUrl = "";
                let audioBlobUrl = null;
                let recordedAudioBlob = null;

                document.getElementById('msg-image')?.addEventListener('change', async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    if (file.size > 5 * 1024 * 1024) {
                        showToast("ไฟล์รูปภาพต้องมีขนาดไม่เกิน 5MB", "error");
                        return;
                    }
                    document.getElementById('attachment-preview').innerText = "กำลังอัปโหลดรูป...";
                    
                    const formData = new FormData();
                    formData.append("image", file);

                    try {
                        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                            method: "POST",
                            body: formData
                        });
                        const data = await res.json();
                        if (data.success) {
                            uploadedImageUrl = data.data.url;
                            document.getElementById('attachment-preview').innerText = "แนบรูปเรียบร้อยแล้ว ✓";
                            showToast("อัปโหลดรูปสำเร็จ", "success");
                        } else {
                            throw new Error("อัปโหลดไม่สำเร็จ");
                        }
                    } catch (err) {
                        showToast("อัปโหลดรูปภาพล้มเหลว", "error");
                        document.getElementById('attachment-preview').innerText = "";
                    }
                });

                // Audio Recorder Logic
                let mediaRecorder;
                let audioChunks = [];
                let isRecording = false;
                const recordBtn = document.getElementById('btn-record-audio');

                recordBtn?.addEventListener('click', async () => {
                    if (!isRecording) {
                        try {
                            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                            mediaRecorder = new MediaRecorder(stream);
                            audioChunks = [];
                            mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                            mediaRecorder.onstop = async () => {
                                recordedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                                document.getElementById('attachment-preview').innerText = "บันทึกเสียงเรียบร้อย ✓";
                                showToast("บันทึกเสียงสำเร็จ", "success");
                            };
                            mediaRecorder.start();
                            isRecording = true;
                            recordBtn.classList.add('bg-rose-600/30', 'text-rose-400', 'border', 'border-rose-700');
                            recordBtn.innerText = "กำลังอัด... (กดเพื่อหยุด)";
                        } catch (err) {
                            showToast("ไม่สามารถเข้าถึงไมโครโฟนได้", "error");
                        }
                    } else {
                        mediaRecorder.stop();
                        isRecording = false;
                        recordBtn.classList.remove('bg-rose-600/30', 'text-rose-400', 'border', 'border-rose-700');
                        recordBtn.innerText = "อัดเสียง";
                    }
                });

                // Submit Form
                document.getElementById('send-message-form')?.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const content = document.getElementById('msg-content').value.trim();
                    if (!content) return;

                    const submitBtn = document.getElementById('btn-submit-msg');
                    submitBtn.disabled = true;
                    submitBtn.innerText = "กำลังส่ง...";

                    try {
                        let finalAudioUrl = "";
                        if (recordedAudioBlob) {
                            const audioRefName = `audios/${Date.now()}_audio.webm`;
                            const storageRef = ref(storage, audioRefName);
                            await uploadBytes(storageRef, recordedAudioBlob);
                            finalAudioUrl = await getDownloadURL(storageRef);
                        }

                        // Generate Anonymous Hint
                        const ua = navigator.userAgent;
                        let device = "Desktop";
                        if (/android/i.test(ua)) device = "Android";
                        else if (/iphone|ipad|ipod/i.test(ua)) device = "iOS";

                        let browser = "Chrome";
                        if (/firefox/i.test(ua)) browser = "Firefox";
                        else if (/safari/i.test(ua) && !/chrome/i.test(ua)) browser = "Safari";
                        else if (/edge/i.test(ua)) browser = "Edge";

                        const hint = `ส่งจาก ${device} (${browser})`;

                        // Save Message to Firestore
                        await addDoc(collection(db, "messages"), {
                            recipientUid: ownerUid,
                            content,
                            imageUrl: uploadedImageUrl || "",
                            audioUrl: finalAudioUrl || "",
                            hint,
                            isRead: false,
                            isPinned: false,
                            isArchived: false,
                            isPublished: false,
                            createdAt: serverTimestamp()
                        });

                        showToast("ส่งข้อความนิรนามสำเร็จ!", "success");
                        document.getElementById('msg-content').value = "";
                        document.getElementById('attachment-preview').innerText = "";
                        uploadedImageUrl = "";
                        recordedAudioBlob = null;
                    } catch (err) {
                        showToast("เกิดข้อผิดพลาดในการส่งข้อความ", "error");
                    } finally {
                        submitBtn.disabled = false;
                        submitBtn.innerText = "ส่งข้อความนิรนาม 🚀";
                    }
                });

            } catch (err) {
                container.innerHTML = `<div class="text-center py-20 text-rose-500">เกิดข้อผิดพลาดในการโหลดโปรไฟล์</div>`;
            }
        }

        // 6. Instagram Story Canvas Generator Modal
        window.openStoryModal = function(encodedContent) {
            const content = decodeURIComponent(encodedContent);
            const modal = document.getElementById('global-modal');
            const contentEl = document.getElementById('modal-content');

            modal.classList.remove('hidden');
            contentEl.innerHTML = `
                <h3 class="text-lg font-bold mb-4">สร้างภาพ Instagram Story 📸</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">เลือกธีม</label>
                        <select id="story-theme" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-brand-500">
                            <option value="minimal">Minimal Light</option>
                            <option value="midnight" selected>Midnight Dark</option>
                            <option value="gradient">Gradient Modern</option>
                            <option value="pastel">Soft Pastel</option>
                        </select>
                    </div>
                    
                    <div class="flex justify-center bg-slate-950 p-4 rounded-2xl border border-slate-800">
                        <canvas id="story-canvas" width="540" height="960" class="w-48 h-[340px] rounded-xl shadow-2xl object-contain"></canvas>
                    </div>

                    <div class="flex gap-3">
                        <button id="btn-download-story" class="flex-1 py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl text-sm transition">
                            ดาวน์โหลดภาพ 📥
                        </button>
                        <button onclick="closeModal()" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl text-sm transition">
                            ปิด
                        </button>
                    </div>
                </div>
            `;

            const canvas = document.getElementById('story-canvas');
            const ctx = canvas.getContext('2d');
            const themeSelect = document.getElementById('story-theme');

            function drawStory() {
                const theme = themeSelect.value;
                let bgGradient, textColor, cardBg;

                if (theme === 'minimal') {
                    bgGradient = ['#f8fafc', '#e2e8f0'];
                    textColor = '#0f172a';
                    cardBg = '#ffffff';
                } else if (theme === 'midnight') {
                    bgGradient = ['#09090b', '#18181b'];
                    textColor = '#f8fafc';
                    cardBg = '#27272a';
                } else if (theme === 'gradient') {
                    bgGradient = ['#4f46e5', '#9333ea'];
                    textColor = '#ffffff';
                    cardBg = 'rgba(0, 0, 0, 0.4)';
                } else {
                    bgGradient = ['#fbcfe8', '#c7d2fe'];
                    textColor = '#312e81';
                    cardBg = '#ffffff';
                }

                // Background
                const grad = ctx.createLinearGradient(0, 0, 0, 960);
                grad.addColorStop(0, bgGradient[0]);
                grad.addColorStop(1, bgGradient[1]);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 540, 960);

                // Card Box
                ctx.fillStyle = cardBg;
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.roundRect(60, 200, 420, 500, 30);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Header Branding
                ctx.fillStyle = textColor;
                ctx.font = 'bold 24px "Plus Jakarta Sans", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("EchoVail Anonymous", 270, 270);

                // Message Body (Multi-line wrap)
                ctx.font = '28px "Plus Jakarta Sans", sans-serif';
                ctx.fillStyle = textColor;
                wrapText(ctx, content, 270, 400, 360, 40);

                // Footer
                ctx.font = '16px "Plus Jakarta Sans", sans-serif';
                ctx.fillStyle = textColor;
                ctx.globalAlpha = 0.7;
                ctx.fillText("ส่งข้อความนิรนามถึงฉันได้ที่ลิงก์นี้ ✨", 270, 630);
                ctx.globalAlpha = 1.0;
            }

            drawStory();
            themeSelect.addEventListener('change', drawStory);

            document.getElementById('btn-download-story').addEventListener('click', () => {
                const link = document.createElement('a');
                link.download = 'echovail-story.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                showToast("ดาวน์โหลดภาพเรียบร้อย!", "success");
            });
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            for(let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = context.measureText(testLine);
                const testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    context.fillText(line, x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, y);
        }

        window.closeModal = function() {
            document.getElementById('global-modal').classList.add('hidden');
        }

        // 8. Analytics View
        async function renderAnalytics(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h1 class="text-2xl font-bold">สถิติผู้ใช้งาน (Analytics) 📊</h1>

                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

                        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl">
                            <p class="text-slate-400 text-sm font-medium">ข้อความที่ยังไม่ได้อ่าน</p>
                            <h3 id="stat-unread" class="text-3xl font-extrabold mt-2 text-indigo-400">-</h3>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl">
                            <p class="text-slate-400 text-sm font-medium">เผยแพร่บน Public Wall</p>
                            <h3 id="stat-published" class="text-3xl font-extrabold mt-2 text-emerald-400">-</h3>
                        </div>
                    </div>
                </div>
            `;

            try {
                const q = query(collection(db, "messages"), where("recipientUid", "==", currentUser.uid));
                const snapshot = await getDocs(q);
                let total = snapshot.size;
                let unread = 0;
                let published = 0;

                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (!data.isRead) unread++;
                    if (data.isPublished) published++;
                });

                document.getElementById('stat-total').innerText = total;
                document.getElementById('stat-unread').innerText = unread;
                document.getElementById('stat-published').innerText = published;
            } catch (err) {
                console.error(err);
            }
        }
    </script>
