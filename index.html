<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex — ส่งข้อความแบบไม่ระบุตัวตน</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f5f3ff', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9' }
                    }
                }
            }
        }
    </script>
    <!-- Chart.js สำหรับ Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(16px); }
        .dark .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(16px); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Custom Modal Container -->
    <div id="modal-container" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4"></div>

    <!-- Navigation Header -->
    <header class="sticky top-0 z-40 border-b border-slate-200 dark:border-slate-800 glass">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="router.navigate('home')">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-violet-600 to-indigo-500 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-violet-500/30">V</div>
                <span class="text-xl font-bold bg-gradient-to-r from-violet-600 to-indigo-500 bg-clip-text text-transparent">Vortex</span>
            </div>
            <div id="nav-actions" class="flex items-center space-x-3">
                <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-800 transition">
                    <svg id="theme-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                </button>
                <div id="auth-nav-slot"></div>
            </div>
        </div>
    </header>

    <!-- Main App Container -->
    <main id="app" class="flex-grow max-w-6xl w-full mx-auto p-4 sm:p-6">
        <!-- Views injected dynamically -->
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-sm text-slate-500">
        <p>&copy; 2026 Vortex Platform. Secure Firebase Architecture & ImgBB Integration.</p>
    </footer>

    <!-- Firebase & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAuafJFSxf5MH2wG8UO5er14peRwT1jl8g",
            authDomain: "anonmsg-7fc77.firebaseapp.com",
            projectId: "anonmsg-7fc77",
            storageBucket: "anonmsg-7fc77.firebasestorage.app",
            messagingSenderId: "619051284089",
            appId: "1:619051284089:web:599084ffeeedf557de46a8",
            measurementId: "G-367T0PCVBJ"
        };

        const IMGBB_API_KEY = "2ee007fe6916aba0796a39684e15efe7";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const functions = getFunctions(app);

        window.currentUser = null;
        window.currentProfile = null;

        // Toast Notification System
        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto p-4 rounded-2xl shadow-xl text-white font-medium flex items-center space-x-2 transition-all transform translate-y-2 opacity-0 ${type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        };

        window.toggleDarkMode = function() {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        };

        // Auth State Listener & Router Resolve
        onAuthStateChanged(auth, async (user) => {
            window.currentUser = user;
            if (user) {
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                if (userDoc.exists()) {
                    window.currentProfile = userDoc.data();
                }
            } else {
                window.currentProfile = null;
            }
            router.resolve();
        });

        window.router = {
            navigate: function(routeName) {
                const urlParams = new URLSearchParams(window.location.search);
                const u = urlParams.get('u');
                if (u) {
                    renderPublicProfile(u);
                    return;
                }
                updateNavAuth();
                if (routeName === 'home') {
                    if (!window.currentUser) renderAuthView();
                    else if (!window.currentProfile) renderOnboardingView();
                    else renderDashboardView();
                } else if (routeName === 'inbox') {
                    renderInboxView();
                } else if (routeName === 'analytics') {
                    renderAnalyticsView();
                } else if (routeName === 'settings') {
                    renderSettingsView();
                } else if (routeName === 'wall') {
                    renderPublicWallView();
                }
            },
            resolve: function() {
                const urlParams = new URLSearchParams(window.location.search);
                const u = urlParams.get('u');
                if (u) {
                    renderPublicProfile(u);
                } else {
                    router.navigate('home');
                }
            }
        };

        function updateNavAuth() {
            const slot = document.getElementById('auth-nav-slot');
            if (window.currentUser) {
                slot.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <button onclick="router.navigate('inbox')" class="px-3.5 py-2 text-xs font-bold rounded-xl bg-violet-600 text-white hover:bg-violet-700 transition">Inbox</button>
                        <button onclick="router.navigate('settings')" class="px-3.5 py-2 text-xs font-bold rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 transition">ตั้งค่า</button>
                        <button onclick="handleSignOut()" class="px-3.5 py-2 text-xs font-bold rounded-xl text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/30 transition">ออก</button>
                    </div>
                `;
            } else {
                slot.innerHTML = '';
            }
        }

        window.handleSignOut = async function() {
            await signOut(auth);
            window.currentProfile = null;
            window.history.pushState({}, '', window.location.pathname);
            router.navigate('home');
            window.showToast('ออกจากระบบเรียบร้อย', 'success');
        };

        // --- VIEWS IMPLEMENTATION ---

        function renderAuthView() {
            document.getElementById('app').innerHTML = `
                <div class="max-w-md mx-auto mt-12 p-8 rounded-3xl glass shadow-2xl border border-slate-200 dark:border-slate-800">
                    <div class="text-center mb-8">
                        <h1 class="text-3xl font-extrabold tracking-tight mb-2">ยินดีต้อนรับสู่ Vortex</h1>
                        <p class="text-sm text-slate-500">แพลตฟอร์มส่งข้อความนิรนาม ปลอดภัย ไร้กังวล</p>
                    </div>
                    
                    <div class="space-y-4">
                        <button onclick="handleGoogleLogin()" class="w-full py-3.5 px-4 rounded-2xl border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-850 font-semibold flex items-center justify-center space-x-3 transition">
                            <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.18 21.32 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.5-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.1 0 9.99 0 12s.43 3.9 1.19 5.42l4.09-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.18 2.68 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
                            <span>เข้าสู่ระบบด้วย Google</span>
                        </button>

                        <div class="flex items-center my-4">
                            <div class="flex-grow border-t border-slate-300 dark:border-slate-800"></div>
                            <span class="px-3 text-xs text-slate-400 uppercase font-semibold">หรือใช้อีเมล</span>
                            <div class="flex-grow border-t border-slate-300 dark:border-slate-800"></div>
                        </div>

                        <form onsubmit="handleEmailAuth(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider mb-1">อีเมล</label>
                                <input type="email" id="auth-email" required class="w-full px-4 py-3.5 rounded-2xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 focus:ring-2 focus:ring-violet-500 outline-none transition text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider mb-1">รหัสผ่าน</label>
                                <input type="password" id="auth-password" required class="w-full px-4 py-3.5 rounded-2xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 focus:ring-2 focus:ring-violet-500 outline-none transition text-sm">
                            </div>
                            <button type="submit" class="w-full py-4 rounded-2xl bg-violet-600 hover:bg-violet-700 text-white font-bold shadow-lg shadow-violet-500/25 transition">เข้าสู่ระบบ / สมัครสมาชิก</button>
                        </form>
                    </div>
                </div>
            `;
        }

        window.handleGoogleLogin = async function() {
            try {
                const provider = new GoogleAuthProvider();
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                if (!userDoc.exists()) {
                    const baseUsername = user.email.split('@')[0].toLowerCase().replace(/[^a-z0-9]/g, '');
                    const reserveFn = httpsCallable(functions, 'reserveUsername');
                    try {
                        await reserveFn({ username: baseUsername, displayName: user.displayName || 'Vortex User' });
                    } catch (e) {
                        await reserveFn({ username: baseUsername + Math.floor(Math.random()*1000), displayName: user.displayName || 'Vortex User' });
                    }
                }
                window.showToast('เข้าสู่ระบบด้วย Google สำเร็จ!', 'success');
                router.resolve();
            } catch (err) {
                window.showToast(err.message, 'error');
            }
        };

        window.handleEmailAuth = async function(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            try {
                let userCred;
                try {
                    userCred = await signInWithEmailAndPassword(auth, email, password);
                } catch (err) {
                    userCred = await createUserWithEmailAndPassword(auth, email, password);
                    const baseUsername = email.split('@')[0].toLowerCase().replace(/[^a-z0-9]/g, '');
                    const reserveFn = httpsCallable(functions, 'reserveUsername');
                    try {
                        await reserveFn({ username: baseUsername, displayName: 'Vortex User' });
                    } catch (e) {
                        await reserveFn({ username: baseUsername + Math.floor(Math.random()*1000), displayName: 'Vortex User' });
                    }
                }
                window.showToast('เข้าสู่ระบบสำเร็จ!', 'success');
                router.resolve();
            } catch (err) {
                window.showToast(err.message, 'error');
            }
        };

        function renderOnboardingView() {
            document.getElementById('app').innerHTML = `
                <div class="max-w-md mx-auto mt-12 p-8 rounded-3xl glass shadow-2xl border border-slate-200 dark:border-slate-800">
                    <h2 class="text-2xl font-bold mb-2">ตั้งค่าโปรไฟล์เริ่มต้น</h2>
                    <p class="text-sm text-slate-500 mb-6">เลือก Username สำหรับลิงก์รับข้อความของคุณ</p>
                    <form onsubmit="handleOnboardingSubmit(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider mb-1">Username</label>
                            <input type="text" id="onboard-username" required placeholder="myusername" class="w-full px-4 py-3.5 rounded-2xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 focus:ring-2 focus:ring-violet-500 outline-none text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider mb-1">ชื่อที่แสดง</label>
                            <input type="text" id="onboard-displayname" required value="${window.currentUser.displayName || ''}" class="w-full px-4 py-3.5 rounded-2xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 focus:ring-2 focus:ring-violet-500 outline-none text-sm">
                        </div>
                        <button type="submit" class="w-full py-4 rounded-2xl bg-violet-600 hover:bg-violet-700 text-white font-bold transition shadow-lg shadow-violet-500/25">บันทึกและเริ่มใช้งาน</button>
                    </form>
                </div>
            `;
        }

        window.handleOnboardingSubmit = async function(e) {
            e.preventDefault();
            const username = document.getElementById('onboard-username').value.trim().toLowerCase();
            const displayName = document.getElementById('onboard-displayname').value.trim();
            try {
                const reserveFn = httpsCallable(functions, 'reserveUsername');
                await reserveFn({ username, displayName });
                window.showToast('ตั้งค่าโปรไฟล์สำเร็จ!', 'success');
                window.location.reload();
            } catch (err) {
                window.showToast(err.message, 'error');
            }
        };

        function renderDashboardView() {
            const p = window.currentProfile;
            const shareLink = `${window.location.origin}${window.location.pathname}?u=${p.username}`;
            document.getElementById('app').innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="md:col-span-1 p-6 rounded-3xl glass shadow-xl border border-slate-200 dark:border-slate-800 flex flex-col items-center text-center">
                        <div class="w-24 h-24 rounded-full bg-violet-600 text-white font-bold text-3xl flex items-center justify-center mb-4 shadow-xl overflow-hidden">
                            ${p.photoURL ? `<img src="${p.photoURL}" class="w-full h-full object-cover">` : p.displayName.charAt(0)}
                        </div>
                        <h2 class="text-xl font-bold">${p.displayName}</h2>
                        <p class="text-sm text-violet-500 font-semibold mb-4">@${p.username}</p>
                        <p class="text-xs text-slate-500 mb-6">${p.bio || ''}</p>
                        <div class="w-full space-y-2.5">
                            <button onclick="router.navigate('inbox')" class="w-full py-3.5 rounded-2xl bg-violet-600 hover:bg-violet-700 text-white font-bold transition shadow-md">เปิดกล่องข้อความ (Inbox)</button>
                            <button onclick="router.navigate('wall')" class="w-full py-3.5 rounded-2xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 font-bold transition">Public Wall 🌟</button>
                            <button onclick="router.navigate('analytics')" class="w-full py-3.5 rounded-2xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 font-bold transition">สถิติและ Analytics</button>
                        </div>
                    </div>
                    <div class="md:col-span-2 p-6 rounded-3xl glass shadow-xl border border-slate-200 dark:border-slate-800 flex flex-col justify-center">
                        <h3 class="text-lg font-bold mb-2">ลิงก์รับข้อความนิรนามของคุณ</h3>
                        <p class="text-sm text-slate-500 mb-4">คัดลอกลิงก์นี้ไปแชร์ลงบน Instagram Story หรือโซเชียลมีเดีย</p>
                        <div class="flex items-center space-x-2 mb-6">
                            <input type="text" readonly value="${shareLink}" id="share-link-input" class="flex-grow px-4 py-3.5 rounded-2xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 font-mono text-sm outline-none">
                            <button onclick="navigator.clipboard.writeText('${shareLink}'); window.showToast('คัดลอกลิงก์แล้ว!', 'success');" class="px-5 py-3.5 rounded-2xl bg-violet-600 hover:bg-violet-700 text-white font-bold transition">คัดลอก</button>
                        </div>
                        <div class="p-4 rounded-2xl bg-violet-500/10 border border-violet-500/20 text-sm flex items-center justify-between">
                            <span>สถานะรับข้อความ: <strong>${p.acceptsMessages !== false ? 'เปิดรับอยู่ 🟢' : 'ปิดชั่วคราว 🔴'}</strong></span>
                            <button onclick="toggleAcceptMessages()" class="px-4 py-2 rounded-xl bg-violet-600 text-white text-xs font-bold">${p.acceptsMessages !== false ? 'ปิดรับ' : 'เปิดรับ'}</button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.toggleAcceptMessages = async function() {
            try {
                const newStatus = window.currentProfile.acceptsMessages === false ? true : false;
                await updateDoc(doc(db, 'users', window.currentUser.uid), { acceptsMessages: newStatus });
                window.currentProfile.acceptsMessages = newStatus;
                renderDashboardView();
                window.showToast('อัปเดตสถานะสำเร็จ', 'success');
            } catch (err) {
                window.showToast(err.message, 'error');
            }
        };

        // --- PUBLIC PROFILE & SEND MESSAGE VIEW ---
        async function renderPublicProfile(username) {
            const app = document.getElementById('app');
            app.innerHTML = `<div class="text-center py-20"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-violet-600 mx-auto"></div></div>`;

            const q = query(collection(db, 'users'), where('usernameLower', '==', username.toLowerCase()));
            const snap = await getDocs(q);
            if (snap.empty) {
                app.innerHTML = `<div class="text-center py-20"><h2 class="text-2xl font-bold mb-2">ไม่พบผู้ใช้งานนี้</h2><p class="text-slate-500">ตรวจสอบลิงก์ใหม่อีกครั้ง</p></div>`;
                return;
            }

            const profile = snap.docs[0].data();
            const recipientUid = snap.docs[0].id;

            app.innerHTML = `
                <div class="max-w-lg mx-auto mt-6 p-8 rounded-3xl glass shadow-2xl border border-slate-200 dark:border-slate-800">
                    <div class="text-center mb-6">
                        <div class="w-20 h-20 rounded-full bg-violet-600 text-white font-bold text-2xl mx-auto flex items-center justify-center mb-3 shadow-xl overflow-hidden">
                            ${profile.photoURL ? `<img src="${profile.photoURL}" class="w-full h-full object-cover">` : profile.displayName.charAt(0)}
                        </div>
                        <h2 class="text-2xl font-bold">${profile.displayName}</h2>
                        <p class="text-sm text-violet-500 font-semibold">@${profile.username}</p>
                        <p class="text-xs text-slate-500 mt-2">${profile.bio || ''}</p>
                    </div>

                    ${profile.acceptsMessages !== false ? `
                        <form onsubmit="handleSendAnonymousMessage(event, '${recipientUid}')" class="space-y-4">
                            <div class="relative">
                                <textarea id="msg-content" rows="4" required placeholder="ส่งข้อความนิรนามหา ${profile.displayName}..." class="w-full p-4 rounded-2xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 focus:ring-2 focus:ring-violet-500 outline-none text-sm resize-none"></textarea>
                                <button type="button" onclick="insertRandomQuestion()" class="absolute bottom-3 right-3 px-3 py-1.5 rounded-xl bg-violet-500/10 text-violet-600 dark:text-violet-400 text-xs font-bold hover:bg-violet-500/20 transition">✨ สุ่มคำถาม</button>
                            </div>
                            
                            <!-- Image Attachment via ImgBB -->
                            <div class="flex items-center space-x-2">
                                <input type="file" id="msg-image" accept="image/*" class="hidden" onchange="previewAttachedImage(this)">
                                <label for="msg-image" class="cursor-pointer px-4 py-2.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-semibold hover:bg-slate-300 dark:hover:bg-slate-700 transition">
                                    <span>📷 แนบรูปภาพ</span>
                                </label>
                                <span id="img-filename" class="text-xs text-slate-400 truncate"></span>
                            </div>
                            <div id="img-preview-container" class="hidden relative w-20 h-20 rounded-xl overflow-hidden border border-slate-300">
                                <img id="img-preview" class="w-full h-full object-cover">
                                <button type="button" onclick="removeAttachedImage()" class="absolute top-1 right-1 bg-black/60 text-white rounded-full p-1 text-[10px]">✕</button>
                            </div>

                            <button type="submit" id="send-msg-btn" class="w-full py-4 rounded-2xl bg-violet-600 hover:bg-violet-700 text-white font-bold shadow-xl shadow-violet-500/25 transition">ส่งข้อความนิรนาม 🚀</button>
                        </form>
                    ` : `
                        <div class="p-6 rounded-2xl bg-rose-500/10 text-rose-600 text-center font-semibold">เจ้าของบัญชีนี้ปิดรับข้อความชั่วคราว</div>
                    `}
                </div>
            `;
        }

        const questionsPool = [
            "ช่วงนี้มีอะไรที่ทำให้ยิ้มได้บ้าง?",
            "ถ้าเลือกไปเที่ยวได้หนึ่งที่ อยากไปที่ไหน?",
            "เพลงที่ฟังบ่อยที่สุดช่วงนี้คือเพลงอะไร?",
            "สิ่งอยากลองทำสักครั้งในชีวิตคืออะไร?",
            "เรื่องเล็ก ๆ ที่ทำให้มีความสุขวันนี้คืออะไร?"
        ];
        window.insertRandomQuestion = function() {
            const q = questionsPool[Math.floor(Math.random() * questionsPool.length)];
            document.getElementById('msg-content').value = q;
        };

        let attachedImageFile = null;
        window.previewAttachedImage = function(input) {
            if (input.files && input.files[0]) {
                attachedImageFile = input.files[0];
                document.getElementById('img-filename').textContent = attachedImageFile.name;
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('img-preview').src = e.target.result;
                    document.getElementById('img-preview-container').classList.remove('hidden');
                };
                reader.readAsDataURL(attachedImageFile);
            }
        };

        window.removeAttachedImage = function() {
            attachedImageFile = null;
            document.getElementById('msg-image').value = '';
            document.getElementById('img-filename').textContent = '';
            document.getElementById('img-preview-container').classList.add('hidden');
        };

        window.handleSendAnonymousMessage = async function(e, recipientUid) {
            e.preventDefault();
            const content = document.getElementById('msg-content').value.trim();
            if (!content) return;
            const btn = document.getElementById('send-msg-btn');
            btn.disabled = true;
            btn.textContent = 'กำลังส่ง...';

            try {
                let imageUrl = '';
                if (attachedImageFile) {
                    const formData = new FormData();
                    formData.append('image', attachedImageFile);
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                        method: 'POST',
                        body: formData
                    });
                    const imgData = await res.json();
                    if (imgData.success) {
                        imageUrl = imgData.data.url;
                    } else {
                        throw new Error('อัปโหลดรูปภาพไม่สำเร็จ');
                    }
                }

                let senderToken = localStorage.getItem('vortex_sender_token');
                if (!senderToken) {
                    senderToken = 'tk_' + Math.random().toString(36).substring(2) + Date.now();
                    localStorage.setItem('vortex_sender_token', senderToken);
                }

                const sendFn = httpsCallable(functions, 'sendAnonymousMessage');
                await sendFn({
                    recipientUid,
                    content,
                    imageUrl,
                    senderToken,
                    userAgent: navigator.userAgent
                });

                window.showToast('ส่งข้อความนิรนามสำเร็จ!', 'success');
                document.getElementById('msg-content').value = '';
                removeAttachedImage();
            } catch (err) {
                window.showToast(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'ส่งข้อความนิรนาม 🚀';
            }
        };

        // --- INBOX VIEW ---
        function renderInboxView() {
            if (!window.currentUser) { router.navigate('home'); return; }
            document.getElementById('app').innerHTML = `
                <div class="max-w-4xl mx-auto">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-2xl font-bold">กล่องข้อความนิรนาม (Inbox)</h2>
                        <button onclick="router.navigate('home')" class="px-4 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-sm font-bold">← กลับหน้าหลัก</button>
                    </div>
                    <div id="messages-list" class="space-y-4">
                        <div class="text-center py-12"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-violet-600 mx-auto"></div></div>
                    </div>
                </div>
            `;
            loadUserMessages();
        }

        async function loadUserMessages() {
            const q = query(collection(db, 'messages'), where('recipientUid', '==', window.currentUser.uid));
            const snap = await getDocs(q);
            const container = document.getElementById('messages-list');
            if (snap.empty) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500 p-8 rounded-3xl glass">ยังไม่มีข้อความนิรนามในขณะนี้</div>`;
                return;
            }

            let html = '';
            snap.forEach(docSnap => {
                const m = docSnap.data();
                const id = docSnap.id;
                html += `
                    <div class="p-6 rounded-3xl glass shadow-xl border border-slate-200 dark:border-slate-800 flex flex-col space-y-3">
                        <div class="flex items-center justify-between text-xs text-slate-400">
                            <span>🕒 ${m.createdAt ? new Date(m.createdAt.toDate()).toLocaleString() : 'เมื่อสักครู่'}</span>
                            <span>📱 ${m.hintDevice || 'อุปกรณ์ทั่วไป'}</span>
                        </div>
                        <p class="text-lg font-medium whitespace-pre-wrap">${m.content}</p>
                        ${m.imageUrl ? `
                            <div class="relative w-40 h-40 rounded-2xl overflow-hidden border border-slate-300 group cursor-pointer select-none" onmousedown="revealImage(this, true)" onmouseup="revealImage(this, false)" ontouchstart="revealImage(this, true)" ontouchend="revealImage(this, false)">
                                <img src="${m.imageUrl}" class="w-full h-full object-cover filter blur-xl transition duration-300">
                                <div class="absolute inset-0 bg-black/40 flex items-center justify-center text-white text-xs font-bold">แตะค้างเพื่อดูรูป</div>
                            </div>
                        ` : ''}
                        <div class="flex items-center space-x-3 pt-2">
                            <button onclick="openReplyModal('${id}')" class="px-4 py-2 rounded-xl bg-violet-600 text-white text-xs font-bold hover:bg-violet-700 transition">ตอบกลับ</button>
                            <button onclick="publishToWall('${id}')" class="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold hover:bg-emerald-700 transition">เผยแพร่ Public Wall</button>
                            <button onclick="openStoryModal('${encodeURIComponent(m.content)}')" class="px-4 py-2 rounded-xl bg-pink-600 text-white text-xs font-bold hover:bg-pink-700 transition">📸 Instagram Story</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        window.revealImage = function(el, show) {
            const img = el.querySelector('img');
            if (show) img.classList.remove('filter', 'blur-xl');
            else img.classList.add('filter', 'blur-xl');
        };

        window.openStoryModal = function(text) {
            const modal = document.getElementById('modal-container');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            modal.innerHTML = `
                <div class="p-6 rounded-3xl glass max-w-md w-full shadow-2xl border border-slate-200 dark:border-slate-800 flex flex-col items-center">
                    <h3 class="text-xl font-bold mb-4">สร้างภาพ Instagram Story</h3>
                    <canvas id="story-canvas" width="1080" height="1920" class="w-64 h-[450px] rounded-2xl shadow-xl mb-4 border border-slate-300"></canvas>
                    <div class="flex space-x-3 w-full">
                        <button onclick="downloadStory()" class="flex-1 py-3 rounded-xl bg-violet-600 text-white font-bold">ดาวน์โหลดภาพ</button>
                        <button onclick="closeModal()" class="px-5 py-3 rounded-xl bg-slate-200 dark:bg-slate-800 font-bold">ปิด</button>
                    </div>
                </div>
            `;
            drawStoryCanvas(decodeURIComponent(text));
        };

        function drawStoryCanvas(text) {
            const canvas = document.getElementById('story-canvas');
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 1080, 1920);
            grad.addColorStop(0, '#7c3aed');
            grad.addColorStop(1, '#db2777');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1080, 1920);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.roundRect(140, 500, 800, 920, 40);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 50px "Plus Jakarta Sans", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('💬 ข้อความนิรนาม', 540, 620);

            ctx.font = '40px "Plus Jakarta Sans", sans-serif';
            wrapText(ctx, text, 540, 800, 700, 60);
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            for(let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = context.measureText(testLine);
                const testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    context.fillText(line, x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, y);
        }

        window.downloadStory = function() {
            const canvas = document.getElementById('story-canvas');
            const link = document.createElement('a');
            link.download = 'vortex-story.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            window.showToast('ดาวน์โหลดภาพ Story สำเร็จ!', 'success');
        };

        window.closeModal = function() {
            const modal = document.getElementById('modal-container');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        };

        window.openReplyModal = function(msgId) {
            const modal = document.getElementById('modal-container');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            modal.innerHTML = `
                <div class="p-6 rounded-3xl glass max-w-md w-full shadow-2xl border border-slate-200 dark:border-slate-800">
                    <h3 class="text-xl font-bold mb-4">ตอบกลับข้อความ</h3>
                    <form onsubmit="handleReplySubmit(event, '${msgId}')" class="space-y-4">
                        <textarea id="reply-content" rows="4" required placeholder="พิมพ์คำตอบของคุณ..." class="w-full p-4 rounded-2xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 outline-none text-sm"></textarea>
                        <button type="submit" class="w-full py-3.5 rounded-2xl bg-violet-600 text-white font-bold">ส่งคำตอบ</button>
                        <button type="button" onclick="closeModal()" class="w-full py-3.5 rounded-2xl bg-slate-200 dark:bg-slate-800 font-bold">ยกเลิก</button>
                    </form>
                </div>
            `;
        };

        window.handleReplySubmit = async function(e, msgId) {
            e.preventDefault();
            const content = document.getElementById('reply-content').value.trim();
            try {
                const fn = httpsCallable(functions, 'submitReply');
                await fn({ messageId: msgId, content });
                window.showToast('ส่งคำตอบสำเร็จ!', 'success');
                closeModal();
            } catch (err) {
                window.showToast(err.message, 'error');
            }
        };

        window.publishToWall = async function(msgId) {
            try {
                const fn = httpsCallable(functions, 'publishWallMessage');
                await fn({ messageId: msgId });
                window.showToast('เผยแพร่ลง Public Wall สำเร็จ!', 'success');
            } catch (err) {
                window.showToast(err.message, 'error');
            }
        };

        // --- ANALYTICS VIEW ---
        function renderAnalyticsView() {
            document.getElementById('app').innerHTML = `
                <div class="max-w-4xl mx-auto">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-2xl font-bold">สถิติและ Analytics</h2>
                        <button onclick="router.navigate('home')" class="px-4 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-sm font-bold">← กลับ</button>
                    </div>

                    </div>

                    datasets: [{ label: 'จำนวนข้อความที่ได้รับ', data: [5, 12, 8, 15, 20, 25, 18], backgroundColor: '#8b5cf6' }]
                }

        // --- SETTINGS VIEW ---
        function renderSettingsView() {
            const p = window.currentProfile;
            document.getElementById('app').innerHTML = `
                <div class="max-w-md mx-auto p-8 rounded-3xl glass shadow-2xl border border-slate-200 dark:border-slate-800">
                    <h2 class="text-2xl font-bold mb-6">ตั้งค่าโปรไฟล์</h2>
                    <form onsubmit="handleUpdateProfile(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase mb-1">ชื่อที่แสดง</label>
                            <input type="text" id="set-displayname" value="${p.displayName}" class="w-full px-4 py-3.5 rounded-2xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 outline-none text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase mb-1">Bio</label>
                            <textarea id="set-bio" rows="3" class="w-full px-4 py-3.5 rounded-2xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 outline-none text-sm resize-none">${p.bio || ''}</textarea>
                        </div>
                        <button type="submit" class="w-full py-4 rounded-2xl bg-violet-600 text-white font-bold">บันทึกการเปลี่ยนแปลง</button>
                    </form>
                </div>
            `;
        }

        window.handleUpdateProfile = async function(e) {
            e.preventDefault();
            const displayName = document.getElementById('set-displayname').value.trim();
            const bio = document.getElementById('set-bio').value.trim();
            try {
                await updateDoc(doc(db, 'users', window.currentUser.uid), { displayName, bio });
                window.currentProfile.displayName = displayName;
                window.currentProfile.bio = bio;
                window.showToast('อัปเดตโปรไฟล์สำเร็จ!', 'success');
                router.navigate('home');

                window.showToast(err.message, 'error');
            }
        };

        // --- PUBLIC WALL VIEW ---
        function renderPublicWallView() {
            document.getElementById('app').innerHTML = `
                <div class="max-w-3xl mx-auto">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-2xl font-bold">Public Wall 🌟</h2>
                        <button onclick="router.navigate('home')" class="px-4 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-sm font-bold">← กลับ</button>
                    </div>
                    <div id="wall-messages" class="space-y-4">
                        <div class="text-center py-12"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-violet-600 mx-auto"></div></div>
                    </div>
                </div>
            `;
            loadPublicWall();
        }

        async function loadPublicWall() {
            const q = query(collection(db, 'publicWall'));
            const snap = await getDocs(q);
            const container = document.getElementById('wall-messages');
            if (snap.empty) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500 p-8 rounded-3xl glass">ยังไม่มีข้อความบน Public Wall</div>`;
                return;
            }
            let html = '';
            snap.forEach(docSnap => {
                const w = docSnap.data();
                html += `
                    <div class="p-6 rounded-3xl glass shadow-xl border border-slate-200 dark:border-slate-800">
                        <p class="text-lg font-medium mb-4">${w.content}</p>
                        <div class="flex items-center justify-between text-xs text-slate-400">
                            <span>เผยแพร่เมื่อ: ${w.publishedAt ? new Date(w.publishedAt.toDate()).toLocaleString() : 'เมื่อสักครู่'}</span>
                            <button onclick="toggleReaction('${docSnap.id}')" class="px-3.5 py-2 rounded-xl bg-violet-500/10 text-violet-600 font-bold">❤️ ${w.reactionsCount || 0}</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        window.toggleReaction = async function(wallId) {
            try {
                const fn = httpsCallable(functions, 'toggleReaction');
                await fn({ wallId });
                loadPublicWall();
            } catch (err) {
                window.showToast(err.message, 'error');
            }
        };

        window.addEventListener('DOMContentLoaded', () => router.resolve());
    </script>
