function toast(message,type="info"){
const el=document.createElement("div");
el.className="toast "+type;el.textContent=message;
$("toastRoot").append(el);
setTimeout(()=>el.remove(),5500);
}
function errorMessage(e){
const map={
"auth/invalid-credential":"อีเมลหรือรหัสผ่านไม่ถูกต้อง",
"auth/email-already-in-use":"อีเมลนี้ถูกใช้งานแล้ว",
"auth/weak-password":"รหัสผ่านไม่ปลอดภัยเพียงพอ",
"auth/too-many-requests":"มีคำขอมากเกินไป",
"auth/requires-recent-login":"กรุณาเข้าสู่ระบบใหม่",
"permission-denied":"ไม่มีสิทธิ์เข้าถึงข้อมูล",
"unavailable":"บริการไม่พร้อมใช้งาน"
};
return e.userMessage||map[e.code]||"ไม่สามารถดำเนินการได้ กรุณาลองอีกครั้ง";
}
function fail(e){console.error(e.code||e.message);toast(errorMessage(e),"error")}
function busy(value){
S.busy=value;
document.querySelectorAll("[data-action]").forEach(b=>b.disabled=value);
}
async function execute(fn){
if(S.busy)return;
busy(true);
try{await fn()}catch(e){fail(e)}finally{busy(false)}
}
async function api(path,data={},privateCall=false){
if(!WORKER_BASE_URL)throw Object.assign(new Error("Worker URL missing"),{
userMessage:"ยังไม่ได้ตั้งค่า Cloudflare Worker URL"
});
const headers={"Content-Type":"application/json"};
if(privateCall){
if(!auth.currentUser)throw Object.assign(new Error("Not authenticated"),{userMessage:"กรุณาเข้าสู่ระบบ"});
headers.Authorization="Bearer "+await auth.currentUser.getIdToken();
}
const response=await fetch(WORKER_BASE_URL.replace(/\/$/,"")+path,{
method:"POST",headers,body:JSON.stringify(data)
});
const result=await response.json().catch(()=>({}));
if(!response.ok||result.success===false)
throw Object.assign(new Error(result.code||"API error"),{
userMessage:result.message||"คำขอไม่สำเร็จ"
});
return result;
}

<div class="field"><label>ชื่อที่แสดง</label><input class="input" name="name" maxlength="60" required></div>
<div class="field"><label>Username</label><input class="input" name="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" required></div>
<div class="field"><label>อีเมล</label><input class="input" name="email" type="email" required></div>
<div class="field"><label>รหัสผ่าน</label><input class="input" name="password" type="password" minlength="8" autocomplete="new-password" required></div>

</form>
<p>มีบัญชีแล้ว? <a href="#" id="loginLink">เข้าสู่ระบบ</a></p></div>`;
$("loginLink").onclick=e=>{e.preventDefault();navigate("login")};
$("registerForm").onsubmit=e=>{
e.preventDefault();
execute(async()=>{
const f=new FormData(e.target);
const username=String(f.get("username")).toLowerCase();
const credential=await createUserWithEmailAndPassword(auth,f.get("email"),f.get("password"));
await updateProfile(credential.user,{displayName:String(f.get("name"))});
try{
await api("/users/register",{
username,displayName:String(f.get("name"))
},true);
}catch(error){
await credential.user.delete().catch(()=>{});
throw error;
}
await sendEmailVerification(credential.user);
toast("สมัครสำเร็จ กรุณายืนยันอีเมล","success");
navigate("dashboard");
});
};
}

async function fetchMessages(reset){
if(reset){S.messages=[];S.cursor=null}
const result=await api("/messages/list",{
cursor:S.cursor,pageSize:20
},true);
S.messages.push(...(result.messages||[]));
S.cursor=result.nextCursor||null;
showMessages();
$("loadMore").classList.toggle("hidden",!S.cursor);
}
function showMessages(){
const items=S.messages.filter(m=>{
if(S.filter==="unread"&&m.read)return false;
if(S.filter==="pinned"&&!m.pinned)return false;
if(S.filter==="archived"&&!m.archived)return false;
if(S.filter!=="archived"&&m.archived)return false;
return String(m.text||"").toLowerCase().includes(S.search.toLowerCase());
});
$("messageList").className="";
$("messageList").innerHTML=items.length?items.map(messageCard).join(""):`<div class="empty">ไม่พบข้อความ</div>`;
document.querySelectorAll("[data-msg]").forEach(b=>b.onclick=()=>handleMessage(b.dataset.msg,b.dataset.id));
document.querySelectorAll(".revealBtn").forEach(button=>{
const card=button.parentElement;
const open=()=>card.classList.add("open");
const close=()=>card.classList.remove("open");
button.addEventListener("pointerdown",open);
button.addEventListener("pointerup",close);
button.addEventListener("pointercancel",close);
button.addEventListener("pointerleave",close);
button.addEventListener("focusout",close);
button.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();open()}});
button.addEventListener("keyup",close);
});
}
function handleMessage(action,id){
const m=S.messages.find(x=>x.id===id);
if(!m)return;
if(action==="story"){openStory(m);return}
if(action==="reply"){openReply(m);return}
if(action==="publish"){previewPublish(m);return}
if(action==="report"){reportContent("message",id);return}
if(action==="delete"){
ask("ลบข้อความ","ข้อความและไฟล์แนบที่เกี่ยวข้องจะถูกจัดการตามนโยบายการลบ",async()=>{
await api("/messages/delete",{messageId:id},true);
await fetchMessages(true);
});return;
}
if(action==="block"){
ask("บล็อกผู้ส่ง","การบล็อก Token ไม่สามารถป้องกันการเปลี่ยนเบราว์เซอร์หรืออุปกรณ์ได้ทั้งหมด",async()=>{
await api("/messages/block",{messageId:id},true);
toast("บล็อกแหล่งส่งแล้ว","success");
});return;
}
execute(async()=>{
await api("/messages/update",{
messageId:id,action
},true);
await fetchMessages(true);
});
}

async function uploadFile(file,kind,recipient=""){
const types=kind==="audio"
?["audio/webm","audio/ogg","audio/mp4","audio/wav","audio/mpeg"]
:["image/jpeg","image/png","image/webp"];
if(!types.includes(file.type))throw Object.assign(new Error("Type"),{userMessage:"ประเภทไฟล์ไม่รองรับ"});
if(file.size>(kind==="audio"?MAX_AUDIO:MAX_IMAGE))
throw Object.assign(new Error("Size"),{userMessage:"ไฟล์ใหญ่เกินกำหนด"});
const session=await api("/upload/authorize",{
kind,recipient,size:file.size,mimeType:file.type
},kind==="avatar");
const form=new FormData();
Object.entries(session.fields||{}).forEach(([k,v])=>form.append(k,v));
form.append("file",file);
const response=await fetch(session.uploadUrl,{method:"POST",body:form});
if(!response.ok)throw new Error("Upload failed");
const uploaded=await response.json();
return await api("/upload/finalize",{
uploadId:session.uploadId,
fileId:uploaded.fileId||uploaded.data?.fileId,
kind
},kind==="avatar");
}

function nextQuestion(category){

const list=bank[category]||bank.general;

S.questions[key]=list.map((_,i)=>i);

const pool=S.questions[key];

async function startRecording(){
if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){
toast("เบราว์เซอร์ไม่รองรับการบันทึกเสียง","error");return;
}
try{
const stream=await navigator.mediaDevices.getUserMedia({audio:true});
S.stream=stream;
const mime=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"].find(x=>MediaRecorder.isTypeSupported(x));
const recorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
S.recorder=recorder;
const chunks=[];
recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
recorder.onstop=()=>{
const blob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"});
if(blob.size<=MAX_AUDIO){
S.audio=blob;
if(S.audioURL)URL.revokeObjectURL(S.audioURL);
S.audioURL=URL.createObjectURL(blob);
$("audioPreview").src=S.audioURL;
$("audioPreview").classList.remove("hidden");
$("clearAudio").disabled=false;
}else toast("เสียงมีขนาดใหญ่เกินกำหนด","error");
stream.getTracks().forEach(t=>t.stop());
S.stream=null;
};
recorder.start();
S.recordSeconds=0;
$("recordBtn").disabled=true;$("stopBtn").disabled=false;
S.recordTimer=setInterval(()=>{
S.recordSeconds++;
$("recordTime").textContent="00:"+String(S.recordSeconds).padStart(2,"0");
if(S.recordSeconds>=MAX_SECONDS)stopRecording();
},1000);
}catch(e){fail(Object.assign(e,{userMessage:"ไม่สามารถเปิดไมโครโฟนได้"}))}
}
function stopRecording(){
clearInterval(S.recordTimer);
if(S.recorder?.state==="recording")S.recorder.stop();
if($("recordBtn"))$("recordBtn").disabled=false;
if($("stopBtn"))$("stopBtn").disabled=true;
}
function clearAudio(){
if(S.recorder?.state==="recording")stopRecording();
S.audio=null;
if(S.audioURL)URL.revokeObjectURL(S.audioURL);
S.audioURL=null;
if($("audioPreview")){$("audioPreview").removeAttribute("src");$("audioPreview").classList.add("hidden")}
if($("clearAudio"))$("clearAudio").disabled=true;
}
/*
 Audio effects are applied through offline rendering.
 Playback-rate pitch shifting changes duration.
 The resulting WAV file is actually modified audio.
*/
async function processVoice(blob,effect){
if(effect==="original")return blob;
const context=new AudioContext();
const buffer=await context.decodeAudioData(await blob.arrayBuffer());
await context.close();
const rate=effect==="lower"?.8:effect==="higher"?1.25:1;
const frames=Math.ceil(buffer.length/rate);
const offline=new OfflineAudioContext(1,frames,buffer.sampleRate);
const source=offline.createBufferSource();
source.buffer=buffer;
source.playbackRate.value=rate;
let node=source;
if(effect==="soft"){
const gain=offline.createGain();gain.gain.value=.65;
node.connect(gain);node=gain;
}
if(effect==="filtered"){
const filter=offline.createBiquadFilter();
filter.type="lowpass";filter.frequency.value=1100;
node.connect(filter);node=filter;
}
node.connect(offline.destination);
source.start();
const rendered=await offline.startRendering();
const samples=rendered.getChannelData(0);
const out=new ArrayBuffer(44+samples.length*2);
const view=new DataView(out);
const write=(offset,text)=>{for(let i=0;i<text.length;i++)view.setUint8(offset+i,text.charCodeAt(i))};
write(0,"RIFF");view.setUint32(4,36+samples.length*2,true);
write(8,"WAVE");write(12,"fmt ");
view.setUint32(16,16,true);view.setUint16(20,1,true);
view.setUint16(22,1,true);view.setUint32(24,rendered.sampleRate,true);
view.setUint32(28,rendered.sampleRate*2,true);
view.setUint16(32,2,true);view.setUint16(34,16,true);
write(36,"data");view.setUint32(40,samples.length*2,true);
for(let i=0;i<samples.length;i++){
const v=Math.max(-1,Math.min(1,samples[i]));
view.setInt16(44+i*2,v<0?v*32768:v*32767,true);
}
return new Blob([out],{type:"audio/wav"});
}

const STORY_THEMES={
minimal:{bg:"#f7f7fc",card:"#ffffff",text:"#242238",accent:"#7055ed"},
midnight:{bg:"#151526",card:"#28283e",text:"#ffffff",accent:"#a99aff"},
gradient:{bg:"#7055ed",card:"#ffffff",text:"#28233b",accent:"#db66cc"},
pastel:{bg:"#fbe6ef",card:"#fff9fc",text:"#51374b",accent:"#d96ca0"}
};
function wrapCanvas(ctx,text,maxWidth){
const lines=[];
for(const paragraph of String(text||"").split("\n")){
let current="";
for(const char of paragraph){
if(ctx.measureText(current+char).width>maxWidth&&current){
lines.push(current);current=char;
}else current+=char;
}
lines.push(current);
}
return lines;
}
function roundRect(ctx,x,y,w,h,r){
ctx.beginPath();ctx.roundRect(x,y,w,h,r);
}
function drawStory(){
const canvas=document.createElement("canvas");
canvas.width=1080;canvas.height=1920;
const ctx=canvas.getContext("2d");
const theme=STORY_THEMES[S.storyTheme];
ctx.fillStyle=S.storyColor||theme.bg;
ctx.fillRect(0,0,1080,1920);
if(S.storyTheme==="gradient"&&!S.storyColor){
const grad=ctx.createLinearGradient(0,0,1080,1920);
grad.addColorStop(0,"#7456ed");grad.addColorStop(1,"#df67bd");
ctx.fillStyle=grad;ctx.fillRect(0,0,1080,1920);
}
const text=S.storyTextColor||theme.text;
ctx.fillStyle=theme.card;
roundRect(ctx,75,500,930,920,52);ctx.fill();
ctx.fillStyle=text;
ctx.textAlign="center";
ctx.font="bold 49px 'Noto Sans Thai',sans-serif";
let lines=wrapCanvas(ctx,S.story.text||"ข้อความเสียง",790);
if(lines.length>12){
ctx.font="bold 37px 'Noto Sans Thai',sans-serif";
lines=wrapCanvas(ctx,S.story.text||"ข้อความเสียง",810);
}
if(lines.length>18)throw Object.assign(new Error("Story text overflow"),{userMessage:"ข้อความยาวเกินพื้นที่ภาพ Story กรุณาเลือกข้อความที่สั้นลง"});
let y=720;
const lineHeight=lines.length>12?57:75;
lines.forEach(line=>{ctx.fillText(line,540,y);y+=lineHeight});
if(S.story.reply){
ctx.fillStyle=theme.accent;
ctx.fillRect(180,1120,720,3);
ctx.fillStyle=text;
ctx.font="35px 'Noto Sans Thai',sans-serif";
const replyLines=wrapCanvas(ctx,S.story.reply,770);
if(replyLines.length>5)throw Object.assign(new Error("Reply overflow"),{userMessage:"คำตอบยาวเกินพื้นที่ภาพ"});
replyLines.forEach((line,i)=>ctx.fillText(line,540,1190+i*50));
}
ctx.fillStyle=S.storyTheme==="midnight"?"#ffffff":"#544a79";
ctx.font="36px Inter,sans-serif";
if(S.storyShowName)ctx.fillText("@"+(S.profile?.username||"whispr"),540,1510);
if(S.storyShowBrand){
ctx.font="bold 44px Inter,sans-serif";
ctx.fillText("Whispr",540,1740);
}
S.storyCanvas=canvas;
return canvas;
}

function drawChart(data){
const c=$("analyticsChart"),ctx=c.getContext("2d");
ctx.clearRect(0,0,c.width,c.height);
const max=Math.max(1,...data.map(x=>Number(x.count||0)));
const width=(c.width-60)/Math.max(1,data.length);
data.forEach((item,i)=>{
const height=180*Number(item.count||0)/max;
ctx.fillStyle="#7055ed";
ctx.fillRect(35+i*width,215-height,Math.max(2,width-5),height);
if(data.length<=14){
ctx.fillStyle="#77748b";ctx.font="11px sans-serif";
ctx.fillText(String(item.date).slice(5),35+i*width,242);
}
});
}
